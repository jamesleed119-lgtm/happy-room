<body class="template">
  <div class="template-wrap clear">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="loading-screen" aria-live="polite">Загрузка...</div>
  </div>

  <script>
    var Module = {
      TOTAL_MEMORY: 268435456,
      errorhandler: null,
      compatibilitycheck: null,
      backgroundColor: "#000000",
      splashStyle: "Light",
      dataUrl: "https://rawcdn.githack.com/bubbls/UGS-Assets/378e4f8f0603c1e9e9241ebce0c1e454ae7a0400/happy%20room/Release/build_web.data",

      asmUrl: "https://rawcdn.githack.com/bubbls/UGS-Assets/378e4f8f0603c1e9e9241ebce0c1e454ae7a0400/happy%20room/Release/build_web.asm.js",

    };

    var canvas = document.getElementById("canvas");
    var loadingScreen = document.getElementById("loading-screen");

    function resizeCanvas() {
      canvas.width = Math.max(1, window.innerWidth - 50);
      canvas.height = Math.max(1, window.innerHeight - 50);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("load", function () {
      loadingScreen.remove();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@378e4f8f0603c1e9e9241ebce0c1e454ae7a0400/happy%20room/Release/UnityLoader.js"></script>
